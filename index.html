const UNITS = { dias: ["día", "días"], semanas: ["semana", "semanas"], meses: ["mes", "meses"] };
function nextDue(t) {
  const d = fromIso(t.last), n = Number(t.every) || 1;
  if (t.unit === "meses") return iso(new Date(d.getFullYear(), d.getMonth() + n, d.getDate()));
  return iso(addDays(d, t.unit === "semanas" ? 7 * n : n));
}
function maintStatus(t) {
  const nx = nextDue(t);
  if (nx < todayIso) return "atrasada";
  if (nx <= iso(addDays(TODAY, 3))) return "pronto";
  return "ok";
}
const MST = { atrasada: ["Atrasada", "bad"], pronto: ["Toca pronto", "warn"], ok: ["Al día", "ok"] };
const maintMine = (me) => (S.maint || []).filter((t) => (isAdmin(me) || t.assignee === me.id) && maintStatus(t) !== "ok");
function vMantenimiento(me) {
  const admin = isAdmin(me);
  const all = (S.maint || []).slice().sort((a, b) => nextDue(a).localeCompare(nextDue(b)));
  const cnt = (s) => all.filter((t) => maintStatus(t) === s).length;
  const cards = all.map((t) => {
    const st = maintStatus(t), nx = nextDue(t), diff = Math.round((fromIso(nx) - TODAY) / DAY);
    const when = diff < 0 ? `Tocaba el ${fmtShort(nx)} (hace ${plural(-diff, "día", "días")})` : diff === 0 ? "Toca hoy" : `Toca el ${fmtShort(nx)} (en ${plural(diff, "día", "días")})`;
    const lastLog = (t.log || []).slice(-1)[0];
    return `<article class="item s-${st === "atrasada" ? "bad" : st === "pronto" ? "warn" : "ok"}">
      <div class="item-top"><div><div class="item-title">${esc(t.name)}</div><div class="meta"><span>${esc(t.place || "")}</span><span>Cada ${Number(t.every) === 1 ? UNITS[t.unit][0] : `${t.every} ${UNITS[t.unit][1]}`}</span><span>${icon("users", "sm")} ${esc(nameOf(t.assignee))}</span></div></div>${pill(MST[st][0], MST[st][1], true)}</div>
      <div class="meta"><span style="color:${st === "atrasada" ? "var(--bad)" : "var(--ink-2)"};font-weight:500">${when}</span><span>Última vez: ${fmtShort(t.last)}${lastLog ? ` por ${esc(firstName(nameOf(lastLog.by)))}${lastLog.note ? ` · ${esc(lastLog.note)}` : ""}` : ""}</span></div>
      <div class="actions"><button type="button" class="btn sm ${st === "ok" ? "" : "primary"}" data-act="maint-done" data-id="${t.id}">${icon("check", "sm")} Marcar como hecha</button>${admin ? `<button type="button" class="btn sm ghost" data-act="maint-edit" data-id="${t.id}">${icon("edit", "sm")} Editar</button><button type="button" class="btn sm ghost danger icon" data-act="maint-del" data-id="${t.id}" aria-label="Eliminar">${icon("trash", "sm")}</button>` : ""}</div>
    </article>`;
  }).join("");
  const tile = (n, l, cls = "") => `<div class="tile ${cls}"><span class="num">${n}</span><span class="lbl">${l}</span></div>`;
  return topbar(me, "Mantenimiento preventivo", "Tareas que se repiten cada cierto tiempo. Cuando toca una, le llega un aviso a la persona responsable.", admin ? `<button type="button" class="btn primary" data-act="maint-new">${icon("plus", "sm")} Nueva tarea</button>` : "")
    + `<div class="tiles" style="margin-bottom:20px">${tile(cnt("atrasada"), "Atrasadas", cnt("atrasada") ? "alert" : "")}${tile(cnt("pronto"), "Tocan en los próximos 3 días")}${tile(cnt("ok"), "Al día")}</div>

  /* Juntar con lo que hay guardado; si alguien guardó justo en ese momento, se vuelve a intentar */
  for (let i = 0; i < 6; i++) {
    const cur = await SB.from("docs").select("datos,actualizado").match({ col: r.col, id: r.id }).maybeSingle();
    if (cur.error) return cur;
    if (!cur.data) return SB.from("docs").insert({ col: r.col, id: r.id, ...row(), datos: r.datos });
    const merged = MERGE[r.col](r.datos, cur.data.datos || {});
    const res = await SB.from("docs").update({ ...row(), datos: merged }).match({ col: r.col, id: r.id }).eq("actualizado", cur.data.actualizado).select("id");

const blockedUpdate = (res) => res && !res.error && Array.isArray(res.data) && res.data.length === 0;
function queueSync() {
  if (!REAL || !SB || !AUTH.email || AUTH.loading || !AUTH.loaded) return;
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncNow, 600);
}
const saveStateText = () => ({ ok: "Todo guardado", saving: "Guardando…", error: "No se pudo guardar", offline: "Sin internet · se guarda al volver" }[SYNC.state] || "");
/* Falla de internet (no de permisos): los cambios se quedan y se vuelven a intentar */
const isNetErr = (e) => (typeof navigator !== "undefined" && navigator.onLine === false) || (!e?.code && /fetch|network|load failed|timed? ?out|offline|aborted/i.test(String(e?.message || e || "")));

  SYNC.state = st;
  const el = document.getElementById("save-state");
  if (el) { el.textContent = saveStateText(); el.className = "save-note " + st; }
}
function pendingChanges() {
  const me = currentUser(); if (!me) return false;
  const rows = allRows(me);
  if (rows.length !== SNAP.size) return true;
  return rows.some((r) => SNAP.get(rowKey(r)) !== rowSer(r));
}
async function syncNow() {
  if (SYNC.busy) { SYNC.again = true; return; }
  const me = currentUser(); if (!me) return;
  SYNC.busy = true; setSaveState("saving");
  let failed = false, offline = false;
  try {
    const rows = allRows(me), next = new Map(rows.map((r) => [rowKey(r), r]));
    for (const [k, r] of next) {
      const prev = SNAP.get(k);
      if (prev === rowSer(r)) continue;
      const res = await writeRow(r, prev === undefined);
      if (res.error && isNetErr(res.error)) { offline = true; break; }
      if (res.error || blockedUpdate(res)) { failed = true; console.warn("No se guardó", k, res.error || "sin permiso"); continue; }
      SNAP.set(k, rowSer(r)); mirrorPut(r);
    }
    if (!offline) for (const k of [...SNAP.keys()]) {
      if (next.has(k)) continue;
      const res = await deleteRowByKey(k);
      if (res.error && isNetErr(res.error)) { offline = true; break; }
      if (res.error) { failed = true; console.warn("No se borró", k, res.error); continue; }
      SNAP.delete(k); mirrorDel(k);
    }
  } catch (e) { if (isNetErr(e)) offline = true; else { failed = true; console.error(e); } }

  if (offline) {

    SYNC.wasOffline = true; setSaveState("offline");
    if (!was) toast("Sin internet. Tus cambios se guardan solos cuando vuelva la conexión.");
    clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncNow, 10000);
    return;
  }
  if (SYNC.wasOffline) { SYNC.wasOffline = false; toast("Conexión de vuelta. Todo guardado."); }
  if (failed) {
    SYNC.again = false;
    setSaveState("error");
    rebuild(); safeRender();
    toast("No se pudo guardar un cambio. Revisa la conexión e inténtalo otra vez.");
    loadAll();
    return;
  }
  setSaveState("ok");
  saveCacheSoon();
  if (SYNC.again) { SYNC.again = false; queueSync(); }
  else if (MIRROR.stale && !pendingChanges()) { rebuild(); safeRender(); }
}

/* ---------- Mantener la información al día ---------- */
async function poll() {
  if (!REAL || !AUTH.email || !AUTH.loaded || AUTH.loading || SYNC.busy || POLL.busy || document.hidden) return;
  if (ui.menuOpen || ui.notifOpen) return;
  const a = document.activeElement;
  if (a && a.matches("input, textarea, select") && !a.id && a.closest("#root")) return;
  if (pendingChanges()) { queueSync(); return; }
  POLL.busy = true;
  try { await loadAll(); } finally { POLL.busy = false; }
}

const ACCTS = { set: null, busy: false, at: 0 };

  try { const { data, error } = await SB.rpc("cuentas_creadas"); if (!error && Array.isArray(data)) { ACCTS.set = new Set(data); if (route() === "usuarios") safeRender(); } }
  finally { ACCTS.busy = false; }

const hasAccount = (u) => !!ACCTS.set && ACCTS.set.has(String(u.email).toLowerCase());

function newCode() {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", r = new Uint32Array(8);
  crypto.getRandomValues(r);
  let c = ""; for (let i = 0; i < 8; i++) c += A[r[i] % A.length];
  return c.slice(0, 4) + "-" + c.slice(4);
}
async function issueCode(email) {

  if (r.error) throw r.error;
  r = await SB.from("invitaciones").insert({ email: e, codigo });
  if (r.error) throw r.error;
  return codigo;
}

const VIEW_FN = { turno: vTurno, perdidos: vPerdidos, limpieza: vLimpieza, mantenimiento: vMantenimiento, comunicados: vComunicados, resumen: vResumen, inicio: vInicio, solicitudes: vSolicitudes, incidentes: vIncidentes, buzon: vBuzon, insumos: vInsumos, mensajes: vMensajes, horarios: vHorarios, habitaciones: vHabitaciones, usuarios: vUsuarios, ajustes: vAjustes };
const route = () => decodeURIComponent((location.hash || "").slice(1));
function go(h) { if (route() === h) render(); else location.hash = h ? "#" + h : ""; }
function commit() { save(); render(); }
let lastAnimKey = "", monthScrollPending = true;
function render() {
  const r = route(), root = $("#root");
  if (r === "huespedes" || r.startsWith("huespedes-")) {
    const room = r.slice(10);
    if (room && ui.guest.presetFor !== room && S.rooms.some((x) => x.n === room)) { ui.guest.presetFor = room; ui.guest.draft = { ...ui.guest.draft, room }; }
    stopWaves(); root.innerHTML = guestHtml(); return;
  }
  if (REAL) {
    if (!AUTH.ready) { stopWaves(); root.innerHTML = loadingHtml(); return; }
    if (!AUTH.email || AUTH.recovery) { root.innerHTML = realLoginHtml(); startWaves(); return; }
    if (!AUTH.loaded) { stopWaves(); root.innerHTML = AUTH.error ? noAccessHtml() : loadingHtml(); return; }
  }
  const me = currentUser();
  if (!me) { if (REAL) { stopWaves(); root.innerHTML = noAccessHtml(); return; } root.innerHTML = loginHtml(); startWaves(); return; }
  stopWaves();
  rollWeeks();
  const allowed = VIEWS.filter((v) => !v.admin || isAdmin(me)).map((v) => v.id);
  const view = allowed.includes(r) ? r : "inicio";
  const content = VIEW_FN[view](me);
  const animKey = view + "|" + (ui.schedId || "") + "|" + me.id;
  root.innerHTML = shellHtml(me, view, content, animKey !== lastAnimKey);
  lastAnimKey = animKey;
  if (view === "habitaciones" && ui.roomView === "mes") {
    const wrap = $("#month-wrap"), t = $(".mg-head.today");
    if (wrap && t && monthScrollPending) { wrap.scrollLeft = Math.max(0, t.offsetLeft - 104 - 2 * 42); }
    monthScrollPending = false;
  }
  if (view === "mensajes") {
    const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
    if (ui.focusComposer) { ui.focusComposer = false; $("#chat-input")?.focus(); }
  }
}

  "room-month": (el) => { const d = Number(el.dataset.d); ui.roomMonth = d === 0 ? 0 : Math.max(-1, Math.min(2, ui.roomMonth + d)); monthScrollPending = true; render(); },
  "res-detail": (el) => modalReservation(el.dataset.id),
  "blk-detail": (el) => modalBlock(el.dataset.id),
  "res-new": (el, me) => { if (canEditRes(me)) modalResForm(null); },
  "blk-new": (el, me) => { if (canEditRes(me)) modalBlockForm(null); },
  "rooms-edit": (el, me) => { if (isAdmin(me)) modalRooms(); },
  "cell-add": (el, me) => { if (canEditRes(me)) modalResForm(null, { room: el.dataset.r, checkin: el.dataset.d }); },
  "res-edit": (el, me) => { if (canEditRes(me)) modalResForm(el.dataset.id); },
  "blk-edit": (el, me) => { if (canEditRes(me)) modalBlockForm(el.dataset.id); },
  "res-delete": (el, me) => {
    const r = S.res.find((x) => x.id === el.dataset.id); if (!r || !canEditRes(me)) return;
    confirmModal({ title: `¿Cancelar la reserva de ${esc(r.guest)}?`, text: `Habitación ${esc(r.room)}, del ${fmtDM(r.checkin)} al ${fmtDM(r.checkout)}. La habitación vuelve a quedar libre.`, ok: "Cancelar reserva", danger: true }, () => {
      S.res = S.res.filter((x) => x.id !== r.id); commit(); toast("Reserva cancelada");
    });
  },
  "blk-delete": (el, me) => {
    const b = S.blocks.find((x) => x.id === el.dataset.id); if (!b || !canEditRes(me)) return;
    confirmModal({ title: `¿Desbloquear la habitación ${esc(b.room)}?`, text: "Vuelve a quedar disponible en esas fechas.", ok: "Desbloquear" }, () => {
      S.blocks = S.blocks.filter((x) => x.id !== b.id); commit(); toast(`Habitación ${b.room} desbloqueada`);
    });
  },
  "room-del": (el, me) => {
    if (!isAdmin(me)) return;
    const n = el.dataset.r;
    if (S.res.some((r) => r.room === n && r.checkout > todayIso) || S.blocks.some((b) => b.room === n && b.to > todayIso)) { toast(`No se puede quitar la ${n}: tiene reservas o bloqueos próximos.`); return; }
    S.rooms = S.rooms.filter((r) => r.n !== n); save(); render(); modalRooms(); toast(`Habitación ${n} quitada`);
  },
  "hl-help": () => modalHotelLink(),

  /* Usuarios y ajustes */
  "user-new": () => modalUser(null),
  "user-edit": (el) => modalUser(userById(el.dataset.id)),
  "logo-remove": () => { S.hotel.logo = null; commit(); toast("Logo quitado"); },
  reset: () => {
    confirmModal({ title: "¿Restablecer los datos de ejemplo?", text: "Se pierde lo que hayas probado en este navegador.", ok: "Restablecer", danger: true }, () => {
      const keep = getSession(); S = seed(); save();
      if (!userById(keep)) setSession(null);
      Object.assign(ui, { chatWith: null, schedId: null, reqTab: null });
      render(); toast("Datos de ejemplo restablecidos");
    });
  },
};

function setFuDraft(pid, patch) {
  const e = fuEff(pid); if (!e.en.length) return;
  const sv = e.sv, d = { ...(ui.fuDraft[pid] || {}), ...patch };
  const same = (d.s || sv.s || "pendiente") === (sv.s || "pendiente") && (d.note !== undefined ? d.note.trim() : sv.note || "") === (sv.note || "");
  if (same) delete ui.fuDraft[pid]; else ui.fuDraft[pid] = d;
}

/* =========================================================
   Formularios
   ========================================================= */
const fail = (id, msg) => { const e = $("#" + id); if (e) e.textContent = msg; };
const FORMS = {
  login: (fd) => {
    const email = (fd.email || "").trim().toLowerCase(), pass = fd.pass || "";
    if (!email || !pass) return fail("l-err", "Escribe tu correo y tu contraseña.");
    const u = S.users.find((x) => x.email.toLowerCase() === email);
    if (!u) return fail("l-err", "No hay una cuenta con ese correo. Revísalo o habla con jefatura.");
    if (!u.active) return fail("l-err", "Esta cuenta está desactivada. Habla con jefatura.");
    if (u.pass !== pass) return fail("l-err", "La contraseña no coincide.");
    setSession(u.id); Object.assign(ui, { menuOpen: false, chatWith: null, schedId: null, reqTab: null, invTab: "semana", invDraft: {}, fuDraft: {} }); go("inicio");
  },
  sso: (fd, f) => {
    const email = (fd.email || "").trim().toLowerCase();
    if (!email) return fail("sso-err", "Escribe el correo de tu cuenta.");
    const u = S.users.find((x) => x.email.toLowerCase() === email);
    if (!u) return fail("sso-err", `Ese correo no está registrado en ${S.hotel.name}. Pide a jefatura que te agregue en «Usuarios y permisos».`);
    if (!u.active) return fail("sso-err", "Esta cuenta está desactivada. Habla con jefatura.");
    closeModal(); setSession(u.id); Object.assign(ui, { menuOpen: false, chatWith: null, schedId: null, reqTab: null, invTab: "semana", invDraft: {}, fuDraft: {} }); go("inicio");
    toast(`Entraste con ${f.dataset.p === "apple" ? "Apple" : "Google"} como ${u.name}`);
  },
  guest: (fd, f) => {
    const g = ui.guest, L = GT[g.lang], msg = (fd.message || "").trim();
    if (g.kind === "comentario" && !Number(fd.rating)) return fail("g-err", L.errRate);
    if (g.kind === "incidente" && !fd.cat) return fail("g-err", L.errCat);
    if (!msg) return fail("g-err", L.errMsg);
    const item = { id: uid(), kind: g.kind, lang: g.lang, room: fd.room || "", cat: fd.cat || "", rating: Number(fd.rating) || 0, message: msg, name: (fd.name || "").trim(), email: (fd.email || "").trim(), photos: g.kind === "incidente" ? (g.draft.photos || []).slice(0, MAX_PHOTOS) : [], at: Date.now(), status: "nuevo" };
    const done = () => { Object.assign(g, { step: "done", draft: g.presetFor ? { room: g.presetFor } : {} }); render(); window.scrollTo(0, 0); };
    if (REAL) { realGuestSubmit(item, f.querySelector('button[type="submit"]')).then((ok) => { if (ok) done(); }); return; }
    S.guest.push(item); save(); done();
  },
  request: (fd, f, me) => {
    const type = fd.type, reason = (fd.reason || "").trim();
    const r = { id: uid(), userId: me.id, type, reason, status: "pendiente", at: Date.now() };
    if (type === "salida") {
      if (!fd.date_salida || !fd.time) return fail("r-err", "Elige el día y la hora de salida.");
      if (!reason) return fail("r-err", "Escribe el motivo para jefatura.");
      Object.assign(r, { date: fd.date_salida, time: fd.time });
    } else if (type === "vacaciones") {
      if (!fd.from || !fd.to) return fail("r-err", "Elige las fechas de inicio y fin.");
      if (fd.to < fd.from) return fail("r-err", "La fecha final no puede ser antes de la inicial.");
      Object.assign(r, { from: fd.from, to: fd.to });
    } else {
      const h = Number(fd.hours);
      if (!fd.date_extras || !(h > 0)) return fail("r-err", "Indica el día y cuántas horas.");
      if (!reason) return fail("r-err", "Cuéntale a jefatura qué cubriste.");
      Object.assign(r, { date: fd.date_extras, hours: h });
    }
    S.requests.push(r); closeModal(); commit(); toast("Solicitud enviada a jefatura.");
  },
  incident: (fd, f, me) => {
    const type = fd.type || "habitacion", text = (fd.text || "").trim(), item = (fd.item || "").trim();
    if (type === "prestamo" && !item) return fail("i-err", "Escribe qué se prestó.");
    if (type !== "prestamo" && !text) return fail("i-err", "Describe lo que pasó.");
    const i = { id: uid(), type, room: fd.room || "", prio: fd.prio || "media", status: "abierto", text: text || `Préstamo: ${item}.`, photos: (ui.incPhotos || []).slice(0, MAX_PHOTOS), by: me.id, at: Date.now(), log: [] };
    ui.incPhotos = [];
    if (type === "prestamo") Object.assign(i, { item, to: (fd.to || "").trim(), due: fd.due || "" });
    S.incidents.push(i);
    if (fd.fromGuest) { const g = findIn(S.guest, fd.fromGuest); if (g) Object.assign(g, { status: "atendido", handledBy: me.id, handledAt: Date.now() }); }
    closeModal(); ui.incFilter = "abiertos"; ui.incType = "todos";
    const stored = save();
    if (fd.fromGuest) { render(); toast("Incidente creado y reporte del huésped marcado como atendido."); }
    else { go("incidentes"); toast("Incidente reportado. Todo el personal lo puede ver."); }
    if (!stored) setTimeout(() => toast("Guardado. Este navegador ya no tiene espacio para más fotos del prototipo: se verán mientras la página siga abierta."), 3500);
  },
  product: (fd, f, me) => {
    const name = (fd.name || "").trim(); if (!name) return fail("p-err", "Escribe el nombre del insumo.");
    S.products.push({ id: "p" + uid(), cat: (fd.cat || "").trim() || "Otros", name, unit: (fd.unit || "").trim() || "unidad" });
    closeModal(); commit(); toast(`${name} agregado`);
  },
  chat: (fd, f, me) => {
    const text = (fd.text || "").trim(); if (!text || !ui.chatWith) return;
    const k = isAdmin(me) ? threadKey(ui.chatWith, me.id) : threadKey(me.id, ui.chatWith);
    (S.threads[k] = S.threads[k] || []).push({ id: uid(), from: me.id, text, at: Date.now() });
    S.reads[me.id] = S.reads[me.id] || {}; S.reads[me.id][k] = Date.now();
    ui.focusComposer = true; commit();
  },
  sched: (fd, f, me) => {
    if (!fd.week) return fail("s-err", "Elige una semana.");
    const base = fd.copy && fd.base ? findIn(S.schedules, fd.base) : null;
    const cells = {};
    for (const u of employees()) cells[u.id] = base && base.cells[u.id] ? base.cells[u.id].slice() : ["L", "L", "L", "L", "L", "L", "L"];
    const s = { id: "s" + uid(), weekStart: fd.week, status: "borrador", by: me.id, cells, notes: "", confirmations: {}, history: [{ at: Date.now(), by: me.id, a: "creado" }] };
    S.schedules.push(s); ui.schedId = s.id; closeModal(); commit(); toast("Borrador creado. Los cambios se guardan solos.");
  },
  comment: (fd, f) => {
    const c = (fd.c || "").trim();
    if (f.dataset.required && !c) return fail("c-err", "Escribe qué hay que corregir.");
    const cb = commentCb; commentCb = null; closeModal(); cb && cb(c);
  },
  user: (fd, f, me) => {
    const id = f.dataset.id;
    const name = (fd.name || "").trim(), email = (fd.email || "").trim().toLowerCase(), title = (fd.title || "").trim(), pass = (fd.pass || "").trim();
    if (!name) return fail("u-err", "Escribe el nombre.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("u-err", "Revisa el correo: parece incompleto.");
    if (S.users.some((u) => u.email.toLowerCase() === email && u.id !== id)) return fail("u-err", "Ya hay una cuenta con ese correo.");
    const role = ["admin", "gerente"].includes(fd.role) ? fd.role : "empleado";
    const perms = role === "admin" ? { correos: !!fd.correos } : role === "empleado" ? { reservas: !!fd.reservas } : {};
    if (id) {
      const u = userById(id); const active = !!fd.active;
      const wasAdmin = u.role === "admin" && u.active, willAdmin = role === "admin" && active;
      if (wasAdmin && !willAdmin && admins().length <= 1) return fail("u-err", "Debe quedar al menos una cuenta de jefatura activa.");
      Object.assign(u, { name, email, title: title || u.title, role, active, perms, vacDays: Math.max(0, Number(fd.vacDays) || 0) }); if (pass && !REAL) u.pass = pass;
      closeModal(); commit(); toast("Cambios guardados");
    } else {
      if (!REAL && pass.length < 4) return fail("u-err", "La contraseña temporal debe tener al menos 4 caracteres.");
      const nu = { id: "u" + uid(), name, email, title: title || "Personal", role, ...(REAL ? {} : { pass }), perms, active: true, vacDays: Math.max(0, Number(fd.vacDays) || 14) };
      S.users.push(nu);
      closeModal(); commit();
      if (REAL) showAccessCode(nu, true); else toast("Persona agregada. Ya puede entrar con su correo.");
    }
  },
  res: (fd, f, me) => {
    if (!canEditRes(me)) return fail("rs-err", "Tu cuenta no puede editar reservas.");
    const id = f.dataset.id, guest = (fd.guest || "").trim();
    if (!guest) return fail("rs-err", "Escribe el nombre del huésped.");
    if (!fd.room) return fail("rs-err", "Elige la habitación.");
    if (!fd.checkin || !fd.checkout) return fail("rs-err", "Elige la llegada y la salida.");
    if (fd.checkout <= fd.checkin) return fail("rs-err", "La salida tiene que ser después de la llegada.");
    const c = conflictFor(fd.room, fd.checkin, fd.checkout, id); if (c) return fail("rs-err", c);
    const data = { guest, room: fd.room, checkin: fd.checkin, checkout: fd.checkout, nights: nightsBetween(fd.checkin, fd.checkout), pax: Math.max(1, Number(fd.pax) || 1), channel: fd.channel || "Directo", note: (fd.note || "").trim() };
    if (id) Object.assign(S.res.find((x) => x.id === id), data); else S.res.push({ id: "r" + uid(), ...data, by: me.id, at: Date.now() });
    closeModal(); commit(); toast(id ? "Reserva actualizada" : "Reserva agregada. Ya cuenta para el reporte de ocupación.");
  },
  block: (fd, f, me) => {
    if (!canEditRes(me)) return fail("bk-err", "Tu cuenta no puede bloquear habitaciones.");
    const id = f.dataset.id, reason = (fd.reason || "").trim();
    if (!fd.room) return fail("bk-err", "Elige la habitación.");
    if (!fd.from || !fd.last) return fail("bk-err", "Elige las fechas.");
    if (fd.last < fd.from) return fail("bk-err", "La fecha final no puede ser antes de la inicial.");
    if (!reason) return fail("bk-err", "Escribe el motivo del bloqueo.");
    const to = iso(addDays(fromIso(fd.last), 1));
    const c = conflictFor(fd.room, fd.from, to, id); if (c) return fail("bk-err", c);
    const data = { room: fd.room, from: fd.from, to, reason };
    if (id) Object.assign(S.blocks.find((x) => x.id === id), data); else S.blocks.push({ id: "b" + uid(), ...data, by: me.id, at: Date.now() });
    closeModal(); commit(); toast(id ? "Bloqueo actualizado" : `Habitación ${fd.room} bloqueada`);
  },
  "room-add": (fd, f, me) => {
    if (!isAdmin(me)) return;
    const n = (fd.n || "").trim(), type = (fd.type || "").trim();
    if (!n) return fail("ro-err", "Escribe el número o nombre de la habitación.");
    if (S.rooms.some((r) => r.n.toLowerCase() === n.toLowerCase())) return fail("ro-err", `Ya existe la habitación ${n}.`);
    S.rooms.push({ n, type }); save(); render(); modalRooms(); toast(`Habitación ${n} agregada`);
  },
  hotel: (fd) => {
    const name = (fd.name || "").trim(); if (!name) { toast("Escribe el nombre del hotel."); return; }
    S.hotel.name = name; S.hotel.place = (fd.place || "").trim(); S.hotel.guestUrl = (fd.guestUrl || "").trim() || GUEST_URL; commit(); toast("Datos del hotel guardados");
  },
  reportcfg: (fd) => {
    const oldKey = curWeekKey();
    S.reportCfg = { day: Number(fd.day), time: fd.time || "07:00" };
    const newKey = curWeekKey();
    if (oldKey !== newKey && S.inv.weeks[oldKey] && !S.inv.weeks[newKey]) { S.inv.weeks[newKey] = S.inv.weeks[oldKey]; delete S.inv.weeks[oldKey]; }
    commit(); toast("Envío semanal actualizado");
  },
};

function handleLogo(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) { toast("Elige un archivo de imagen."); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || 600, h = img.naturalHeight || 300, k = Math.min(1, 600 / w, 320 / h);
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      S.hotel.logo = c.toDataURL("image/png"); commit(); toast("Logo actualizado");
    };
    img.onerror = () => toast("No se pudo leer la imagen.");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (e.target.matches("[data-overlay]")) { closeModal(); return; }
  if ((ui.menuOpen || ui.notifOpen) && !e.target.closest(".me-wrap, .bell-wrap")) {
    if (ui.notifOpen) { const me0 = currentUser(); if (me0) markNotifSeen(me0); }
    ui.menuOpen = false; ui.notifOpen = false; if (!el) { render(); return; }
  }
  if (!el) {
    const link = e.target.closest('a[href^="#"]');
    if (link && link.getAttribute("href") === (location.hash || "#")) {
      e.preventDefault(); ui.schedId = null; if (isMobile()) ui.chatWith = null; render(); window.scrollTo(0, 0);
    }
    return;
  }
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, currentUser(), e);
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  const fn = FORMS[f.dataset.form]; if (fn) fn(fd, f, currentUser());
});
document.addEventListener("change", (e) => {
  const el = e.target, k = el.dataset.change; if (!k) return;
  if (CHANGE_X[k]) { const me = currentUser(); if (me) CHANGE_X[k](el, me); return; }
  if (k === "cell") {
    const s = findIn(S.schedules, el.dataset.s); if (!s) return;
    s.cells[el.dataset.u][+el.dataset.d] = el.value; el.className = `shift-sel sh-${el.value}`; save();
  } else if (k === "sched-notes") {
    const s = findIn(S.schedules, el.dataset.s); if (s) { s.notes = el.value; save(); }
  } else if (k === "req-type" || k === "inc-type-form") {
    $$("[data-show]", el.form).forEach((x) => { x.hidden = x.dataset.show !== el.value; });
    if (k === "req-type") { const hint = $("#r-hint"); if (hint) hint.textContent = el.value === "vacaciones" ? "Opcional para vacaciones." : "Obligatorio para salida temprano y horas extra."; }
  } else if (k === "photo") {
    const scope = el.dataset.scope, list = photoList(scope);
    const all = Array.from(el.files || []), files = all.slice(0, Math.max(0, MAX_PHOTOS - list.length));
    el.value = "";
    if (!files.length) return;
    const errMsg = scope === "guest" ? GT[ui.guest.lang].photoErr : "No se pudo cargar una foto. Intenta con otra.";
    Promise.all(files.map((f) => readPhoto(f).catch(() => null))).then((res) => {
      const ok = res.filter(Boolean); list.push(...ok); refreshPhotos(scope);
      if (ok.length < res.length) toast(errMsg);
      else if (all.length > files.length) toast(scope === "guest" && ui.guest.lang === "en" ? "Up to 3 photos." : "Máximo 3 fotos.");
    });
  } else if (k === "room-type") {
    const r = S.rooms.find((x) => x.n === el.dataset.r); if (r) { r.type = el.value.trim(); save(); render(); toast(`Tipo de la ${r.n} guardado`); }
  } else if (k === "logo") handleLogo(el.files && el.files[0]);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "inv-q") {
    ui.invSearch = el.value; const q = el.value.trim().toLowerCase();
    $$(".inv-row").forEach((r) => { r.hidden = !!q && !r.dataset.name.includes(q); });
    $$("[data-group]").forEach((g) => { g.hidden = !g.querySelector(".inv-row:not([hidden])"); });
  } else if (el.dataset.input === "fu-note") {
    const id = el.dataset.id;
    setFuDraft(id, { note: el.value });
    const row = el.closest(".fu-row"), dirty = !!ui.fuDraft[id];
    if (row) { row.classList.toggle("unsaved", dirty); const who = row.querySelector(".fu-who"); if (who && dirty) who.innerHTML = ' · <span class="unsaved-dot"></span> Sin guardar'; }
    refreshSaveBar();
  } else if (el.dataset.change === "sched-notes") {
    const s = findIn(S.schedules, el.dataset.s); if (s) { s.notes = el.value; save(); }
  } else if (el.closest('form[data-form="guest"]')) { const err = $("#g-err"); if (err) err.textContent = ""; }
});
window.addEventListener("hashchange", () => {
  ui.menuOpen = false; closeModal();
  if (route() !== "horarios") ui.schedId = null;
  monthScrollPending = true;
  render(); window.scrollTo(0, 0);
});
window.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#modal-root").innerHTML) closeModal();
  else if (ui.menuOpen || ui.notifOpen) { if (ui.notifOpen) { const me0 = currentUser(); if (me0) markNotifSeen(me0); } ui.menuOpen = false; ui.notifOpen = false; render(); }
});
window.addEventListener("storage", (e) => {
  if (!REAL && e.key === KEY && !$("#modal-root").innerHTML && !document.activeElement?.matches("input, textarea, select")) { S = load(); render(); }
});

Object.assign(ACT, ACT_X, ACT_R);
Object.assign(FORMS, FORMS_X, FORMS_R);
if (REAL) realInit(); else render();

</script>
