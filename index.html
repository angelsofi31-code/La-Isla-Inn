<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Isla Inn · Plataforma</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root {
  /* Layout: barra lateral flotante y redondeada sobre fondo blanco; en celular, barra superior + barra de pestañas inferior.
     Colores de La Isla Inn: azul celeste del mar (acción), rojo atardecer (acento de títulos), amarillo sol (detalles). */
  --bg: #ffffff;
  --surface: #f3f8fa;
  --surface-2: #e8f1f5;
  --ink: #13212a;
  --ink-2: #3a4b55;
  --muted: #6f808a;
  --line: #e0e9ed;
  --accent: #11789a;
  --accent-ink: #0b5c76;
  --accent-soft: #e1f2f7;
  --sea: #138aa6;
  --coral: #e0602f;
  --coral-soft: #fdeae2;
  --sun: #f2b040;
  --sun-soft: #fdf3dd;
  --ok: #23845a; --ok-soft: #e2f3e9;
  --warn: #a2690f; --warn-soft: #fcf1da;
  --bad: #c03636; --bad-soft: #fbe7e7;
  --info: #3d5fb8; --info-soft: #e8edfa;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-ui: "Outfit", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --shadow: 0 1px 2px rgba(14, 44, 58, .04), 0 10px 28px -14px rgba(14, 44, 58, .16);
  --shadow-lg: 0 30px 80px -24px rgba(10, 36, 50, .35);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-weight: 400; font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
#root { min-height: 100%; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent-ink); }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }

/* ---------- Marca ---------- */
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.brand-logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; background: var(--surface-2); }
.brand-logo img, .brand-logo svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand-name { font-family: var(--font-display); font-size: 25px; line-height: 1; letter-spacing: .005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-place { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-top: 3px; white-space: nowrap; }

.brand-img { display: block; height: 66px; width: auto; max-width: 210px; object-fit: contain; }
.side .brand-img { height: 78px; max-width: 210px; }
.login .brand-img { height: 78px; }
.guest-top .brand-img { height: 64px; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 12px; margin: 12px 0 12px 12px; height: calc(100dvh - 24px);
  background: var(--surface); border-radius: 30px; padding: 22px 14px 16px;
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.side .brand { padding: 0 8px 18px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); padding: 12px 14px 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 999px;
  color: var(--ink-2); text-decoration: none; font-size: 14.5px; transition: background .15s, color .15s;
}
.nav a:hover { background: rgba(17, 120, 154, .07); }
.nav a.active { background: var(--bg); color: var(--accent-ink); box-shadow: var(--shadow); font-weight: 500; }
.badge {
  margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 500; display: inline-grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.badge.soft { background: var(--surface-2); color: var(--ink-2); }
.side-foot { margin-top: auto; padding: 14px 8px 0; }
.demo-note { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 18px; padding: 12px 14px; line-height: 1.45; }
.demo-note b { color: var(--ink-2); font-weight: 500; }
.save-note { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin: 0; }
.save-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.save-note.saving::before { background: var(--sun); }
.save-note.error { color: var(--bad); }
.save-note.error::before { background: var(--bad); }
.save-note.offline { color: var(--warn); }
.save-note.offline::before { background: var(--sun); }
.code-box { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 30px; letter-spacing: .12em; text-align: center; padding: 18px; border-radius: 20px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; user-select: all; }
.link-btn { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; text-align: left; }
.link-btn.quiet { color: var(--muted); font-weight: 400; }

.main { padding: 30px 40px 72px; min-width: 0; width: 100%; max-width: 1200px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.page-title { font-weight: 400; font-size: 30px; letter-spacing: -.012em; line-height: 1.15; }
.page-sub { color: var(--muted); margin-top: 4px; max-width: 62ch; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-bottom: 8px; }
.hello { font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 5.4vw, 58px); line-height: 1; letter-spacing: -.01em; }
.hello em { color: var(--coral); }
.mtop, .tabbar { display: none; }

/* ---------- Usuario ---------- */
.me-wrap { position: relative; flex: none; }
.me {
  display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); cursor: pointer; text-align: left;
}
.me:hover { border-color: #c9d8df; }
.me-name { font-size: 14px; font-weight: 500; line-height: 1.15; }
.me-role { font-size: 12px; color: var(--muted); line-height: 1.15; }
.av {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 13px; font-weight: 500; background: var(--accent-soft); color: var(--accent-ink);
}
.av.boss { background: #15394b; color: #e3f2f8; }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); background: var(--bg); border: 1px solid var(--line);
  border-radius: 22px; padding: 8px; box-shadow: var(--shadow-lg); min-width: 290px; z-index: 40; animation: pop .16s ease-out;
}
.menu { max-height: min(70vh, 560px); overflow-y: auto; }
.menu-sub { font-size: 12px; color: var(--accent-ink); font-weight: 500; padding: 8px 12px 2px; }
.menu-title { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 10px 12px 6px; }
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; cursor: pointer;
  padding: 8px 10px; border-radius: 14px; text-align: left;
}
.menu button:hover { background: var(--surface); }
.menu button.on { background: var(--accent-soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

/* ---------- Botones y controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  font-weight: 500; font-size: 14.5px; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: #c5d6de; background: var(--surface); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: transparent; }
.btn.ok { color: var(--ok); }
.btn.ok:hover { background: var(--ok-soft); border-color: transparent; }
.btn.solid-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.solid-danger:hover { background: #a7362e; border-color: #a7362e; }
.btn.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
a.person { text-decoration: none; color: inherit; }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13.5px; }
.btn.icon { width: 42px; padding: 0; }
.btn.sm.icon { width: 34px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.hint { font-size: 12.5px; color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], input[type=search], select, textarea {
  font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 14px; padding: 11px 14px; width: 100%; transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(17, 120, 154, .13); }
.form { display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--bad); font-size: 13.5px; min-height: 1px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14.5px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 2px; }

.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button, .seg label {
  border: 0; background: transparent; padding: 7px 15px; border-radius: 999px; font-size: 14px; color: var(--ink-2);
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; position: relative;
}
.seg button.on, .seg label:has(input:checked) { background: var(--bg); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
.seg label input { position: absolute; opacity: 0; pointer-events: none; }
.seg .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-size: 13.5px;
  cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; position: relative;
}
.chip:hover { border-color: #c5d6de; }
.chip.on, .chip:has(input:checked) { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 500; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.5;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.pill.line { background: transparent; border: 1px solid var(--line); }

/* ---------- Bloques ---------- */
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px; }
.card.soft { background: var(--surface); border-color: transparent; }
.card h2, .h2 { font-size: 17px; font-weight: 500; letter-spacing: -.005em; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 14px; }
.tile {
  background: var(--surface); border-radius: 24px; padding: 18px 20px 20px; text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 6px; transition: transform .2s ease, background .2s; position: relative;
}
a.tile:hover { transform: translateY(-2px); background: var(--surface-2); }
.tile-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
.tile .num { font-size: 40px; font-weight: 300; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .num.txt { font-size: 22px; font-weight: 400; letter-spacing: -.005em; line-height: 1.25; padding: 6px 0 4px; }
.tile .lbl { color: var(--ink-2); font-size: 14.5px; }
.tile .sub { font-size: 12.5px; color: var(--muted); }
.tile.alert .num { color: var(--bad); }

.item {
  position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 16px 22px;
  border-radius: 22px; background: var(--bg); border: 1px solid var(--line);
}
.item::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: transparent; }
.item.s-alta::before, .item.s-bad::before { background: var(--bad); }
.item.s-media::before, .item.s-warn::before { background: #e0a23c; }
.item.s-baja::before, .item.s-ok::before { background: #9cc9b9; }
.item.s-info::before { background: var(--info); }
.item.dim { background: var(--surface); border-color: transparent; }
.item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.item-title { font-weight: 500; font-size: 15.5px; line-height: 1.35; }
.item-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item-text { color: var(--ink-2); font-size: 14.5px; max-width: 70ch; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; }
.meta span { display: inline-flex; gap: 6px; align-items: center; }
.note {
  background: var(--surface); border-radius: 16px; padding: 10px 14px; font-size: 14px; color: var(--ink-2);
}
.note b { font-weight: 500; color: var(--ink); }
.note.warn { background: var(--warn-soft); }
.note.bad { background: var(--bad-soft); }
.note.ok { background: var(--ok-soft); }

.callout {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 22px; background: var(--info-soft); color: var(--ink-2);
}
.callout svg { color: var(--info); margin-top: 1px; }
.callout.accent { background: var(--accent-soft); }
.callout.accent svg { color: var(--accent); }
.callout.warn { background: var(--warn-soft); }
.callout.warn svg { color: var(--warn); }
.callout-body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.callout-title { font-weight: 500; color: var(--ink); }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); background: var(--surface); border-radius: 24px; }
.empty .h { color: var(--ink-2); font-weight: 500; margin-bottom: 4px; }

.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain > li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-plain > li:last-child { border-bottom: 0; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Fotos ---------- */
.photos { display: flex; flex-wrap: wrap; gap: 10px; }
.ph, .ph-add { width: 96px; height: 96px; border-radius: 18px; overflow: hidden; position: relative; flex: none; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(19, 33, 42, .72); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.ph-add { border: 1.5px dashed #bcd0d9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--accent-ink); font-size: 12.5px; font-weight: 500; cursor: pointer; background: var(--surface); text-align: center; padding: 6px; }
.ph-add:hover { border-color: var(--accent); background: var(--accent-soft); }
.ph-add svg { width: 26px; height: 26px; }
.field:has(input[type=file]:focus-visible) .ph-add { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 76px; height: 76px; border-radius: 14px; overflow: hidden; border: 0; padding: 0; cursor: zoom-in; background: var(--surface); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
.thumb:hover img { transform: scale(1.05); }
.lightbox img { width: 100%; max-height: 68vh; object-fit: contain; display: block; border-radius: 18px; background: #0d1a20; }

/* ---------- Avisos ---------- */
.top-right { display: flex; align-items: center; gap: 8px; flex: none; }
.bell-wrap { position: relative; }
.bell { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; cursor: pointer; position: relative; color: var(--ink-2); padding: 0; }
.bell:hover { border-color: #c5d6de; color: var(--ink); }
.bell .badge { position: absolute; top: -4px; right: -4px; margin: 0; min-width: 20px; height: 20px; font-size: 11px; padding: 0 5px; }
.notif-panel { width: min(390px, calc(100vw - 24px)); }
.notif-panel > button.unread { background: #f2f9fc; }
.notif-panel > button { align-items: flex-start; }

/* ---------- Limpieza ---------- */
.hk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.hk-card { border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.hk-card.urgent { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.hk-card .room-num { font-size: 32px; }
.hk-mark { width: 100%; }
.hk-mark button { flex: 1; padding: 7px 6px; }
.mark button.on.sucia { background: var(--bad); color: #fff; font-weight: 500; }
.mark button.on.limpiando { background: var(--sun-soft); color: var(--warn); font-weight: 500; }
.mark button.on.lista { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.mark button.on.revisada { background: var(--accent); color: #fff; font-weight: 500; }

/* ---------- Entrega de turno y comunicados ---------- */
.checklist { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist li { padding: 10px 12px; border-radius: 14px; background: var(--surface); }
.checklist li.done .ck-t { text-decoration: line-through; color: var(--muted); }
.news-title { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; margin: 8px 0 6px; }
.card.news.important { border-color: #f0d49c; background: linear-gradient(180deg, #fffaf0, #ffffff 60%); }
.card.news.unread { box-shadow: var(--shadow); }
.card.news .meta .av { width: 26px; height: 26px; font-size: 10.5px; }

/* ---------- Resumen del mes ---------- */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.bar-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.bar-track { height: 12px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.bar { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-val { color: var(--ink); min-width: 44px; text-align: right; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 460px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 12px 8px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:not(:first-child), .tbl td:not(:first-child) { text-align: right; }
.vac-bar { height: 10px; border-radius: 999px; background: var(--bg); display: flex; overflow: hidden; }
.vac-bar .t { background: var(--accent); }
.vac-bar .p { background: var(--sun); }

/* ---------- Códigos QR ---------- */
.qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-height: 58vh; overflow-y: auto; padding: 2px; }
.qr-card { border: 1px dashed #bcd0d9; border-radius: 20px; padding: 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.qr-top img { height: 44px; }
.qr-room { font-weight: 500; font-size: 16px; }
.qr-txt { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; }
.qr-missing { width: 168px; height: 168px; display: grid; place-items: center; background: var(--surface); border-radius: 12px; font-size: 12px; color: var(--muted); padding: 12px; }
svg.qr { display: block; }

/* ---------- Ocupación ---------- */
.occ { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.ring { width: 112px; height: 112px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-num b { font-size: 28px; font-weight: 300; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-num span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.occ-stats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 26px; }
.occ-stats b { font-size: 24px; font-weight: 300; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.occ-stats span { font-size: 13px; color: var(--muted); }

/* ---------- Insumos ---------- */
.inv-group { border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; }
.inv-group-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--surface); gap: 10px; }
.inv-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.inv-row:first-of-type { border-top: 0; }
.inv-name { font-weight: 500; font-size: 15px; }
.inv-sub { font-size: 12.5px; color: var(--muted); }
.stock { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; gap: 2px; flex: none; }
.stock button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.stock button:hover { color: var(--ink); }
.stock button.on.hay { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.stock button.on.poco { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.stock button.on.agotado { background: var(--bad); color: #fff; font-weight: 500; }

/* ---------- Insumos: conteo semanal ---------- */
.week-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
.week-title { font-size: 20px; font-weight: 400; letter-spacing: -.01em; }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sea), var(--accent)); }
.mark { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; gap: 2px; flex: none; }
.mark button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.mark button:hover { color: var(--ink); }
.mark button.on.queda { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.mark button.on.noqueda { background: var(--coral); color: #fff; font-weight: 500; }
.mark button.draft { box-shadow: inset 0 0 0 1.5px currentColor; }
.inv-row.unsaved, .fu-row.unsaved { background: #fffcf3; }
.unsaved-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); display: inline-block; }
.savebar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 35; display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: #fff; padding: 8px 8px 8px 20px; border-radius: 999px; box-shadow: var(--shadow-lg); animation: toastIn .2s ease-out;
  max-width: calc(100% - 24px); white-space: nowrap;
}
.savebar .btn { height: 38px; }
.savebar .btn.ghost { color: #d9e6ec; }
.savebar .btn.ghost:hover { background: rgba(255, 255, 255, .1); }
.savebar .btn.primary { background: var(--sun); border-color: var(--sun); color: #2b1d00; }
.savebar .btn.primary:hover { background: #e7a12b; border-color: #e7a12b; }
.follow { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.follow button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.follow button:hover { color: var(--ink); }
.follow button.on.pendiente { background: var(--bg); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
.follow button.on.repuesto { background: var(--ok); color: #fff; font-weight: 500; }
.follow button.on.pospuesto { background: var(--sun-soft); color: var(--warn); font-weight: 500; }
.follow button.on.nohace { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
.fu-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.fu-row:first-child { border-top: 0; }
.fu-note { flex: 1 1 220px; min-width: 0; }
.fu-note input { padding: 8px 14px; border-radius: 999px; font-size: 14px; background: var(--surface); border-color: transparent; }
.fu-note input:focus { background: var(--bg); }
.week-list-item { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

/* ---------- Entrar con Google / Apple ---------- */
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.social { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.social { height: 48px; width: 100%; }
.btn.apple { background: #111; border-color: #111; color: #fff; }
.btn.apple:hover { background: #2a2a2a; border-color: #2a2a2a; }

/* ---------- Mensajes ---------- */
.chat {
  display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100dvh - 190px); min-height: 480px;
  border: 1px solid var(--line); border-radius: 30px; overflow: hidden; background: var(--bg);
}
.chat-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.chat-list-title { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 10px 10px 6px; }
.person {
  display: flex; gap: 12px; padding: 10px; border-radius: 18px; cursor: pointer; align-items: center;
  width: 100%; border: 0; background: transparent; text-align: left;
}
.person:hover { background: var(--surface); }
.person.on { background: var(--accent-soft); }
.person-name { font-weight: 500; font-size: 14.5px; }
.person-last { font-size: 13px; color: var(--muted); }
.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.thread-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.lock { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.msgs { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 6px; }
.day-sep { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); padding: 3px 12px; border-radius: 999px; margin: 10px 0; }
.bubble { max-width: min(78%, 520px); padding: 10px 14px 8px; border-radius: 22px; font-size: 14.5px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble time { display: block; font-size: 11px; opacity: .7; margin-top: 3px; text-align: right; }
.bubble.mine { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 8px; }
.bubble.theirs { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 8px; }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.composer input { border-radius: 999px; padding-left: 18px; }
.chat-empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }

/* ---------- Horarios ---------- */
.sched-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 24px; background: var(--bg); }
table.sched { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
.sched th, .sched td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); font-weight: 400; }
.sched tr:last-child td { border-bottom: 0; }
.sched thead th { font-size: 12.5px; color: var(--muted); padding-top: 14px; padding-bottom: 12px; }
.sched thead th b { display: block; font-size: 15px; color: var(--ink); font-weight: 500; }
.sched thead th.today b { color: var(--accent); }
.sched th.name, .sched td.name { text-align: left; padding-left: 18px; position: sticky; left: 0; background: var(--bg); z-index: 1; min-width: 160px; }
.sched td.name b { display: block; font-weight: 500; font-size: 14.5px; }
.sched td.name span { font-size: 12px; color: var(--muted); }
.sched tr.mine td { background: #f1f8fb; }
.sched tr.mine td.name b::after { content: " · tú"; color: var(--accent); font-weight: 400; }
.shift {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 76px; padding: 5px 8px;
  border-radius: 14px; font-size: 13px; font-weight: 500; line-height: 1.2;
}
.shift small { font-size: 11px; font-weight: 400; opacity: .8; }
.sh-M { background: #fdf3d8; color: #84600f; }
.sh-T { background: #fde6dc; color: #9b4422; }
.sh-N { background: #e4e8f6; color: #34478a; }
.sh-I { background: var(--accent-soft); color: var(--accent-ink); }
.sh-L { background: var(--surface); color: var(--muted); font-weight: 400; }
.sh-V { background: #eee6f8; color: #63478f; }
select.shift-sel {
  appearance: none; -webkit-appearance: none; border: 0; text-align: center; text-align-last: center; cursor: pointer;
  width: 92px; padding: 9px 6px; border-radius: 14px; font-size: 13px; font-weight: 500;
}
select.shift-sel:focus { box-shadow: 0 0 0 3px rgba(17, 120, 154, .25); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend .shift { min-width: 0; flex-direction: row; gap: 6px; padding: 4px 10px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .tdot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg); margin-top: 4px; }
.timeline .tdot.warn { border-color: #e0a23c; }
.timeline .tdot.ok { border-color: var(--ok); background: var(--ok); }
.confirm-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.confirm-list > div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: var(--surface); }

/* ---------- Habitaciones ---------- */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.room { border-radius: 22px; padding: 14px 16px 16px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.room-num { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.room-type { font-size: 12px; color: var(--muted); }
.room-guest { font-size: 13.5px; color: var(--ink-2); margin-top: auto; }
.room.st-ocupada { background: var(--accent-soft); border-color: transparent; }
.room.st-llegada { background: var(--info-soft); border-color: transparent; }
.room.st-salida { background: var(--warn-soft); border-color: transparent; }
.room.st-bloqueada { background: repeating-linear-gradient(-45deg, #f6eeee, #f6eeee 8px, #fbf6f6 8px, #fbf6f6 16px); border-color: transparent; }
.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 24px; }
.gantt { display: grid; grid-template-columns: 96px repeat(7, minmax(88px, 1fr)); grid-auto-rows: 46px; min-width: 760px; position: relative; }
.g-head { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); line-height: 1.2; }
.g-head b { color: var(--ink); font-weight: 500; font-size: 14px; }
.g-head.today b { color: var(--accent); }
.g-room { display: flex; align-items: center; padding-left: 16px; font-weight: 500; font-size: 14px; border-bottom: 1px solid var(--line); }
.g-cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.g-cell.today { background: rgba(17, 120, 154, .05); }
.g-bar {
  margin: 7px 4px; border-radius: 12px; padding: 0 10px; display: flex; align-items: center; font-size: 12.5px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; background: var(--accent); color: #fff;
}
.g-bar.blk { background: repeating-linear-gradient(-45deg, #f3dcd9, #f3dcd9 6px, #f9ecea 6px, #f9ecea 12px); color: var(--bad); }
.g-bar.cut-l { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.g-bar span { overflow: hidden; text-overflow: ellipsis; }
.g-bar { border: 0; font: inherit; font-size: 12.5px; font-weight: 500; text-align: left; cursor: pointer; }
button.g-bar:hover { filter: brightness(1.08); }
.g-bar.cut-r { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.mgantt { display: grid; grid-auto-rows: 42px; width: max-content; position: relative; }
.mg-head { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-bottom: 1px solid var(--line); line-height: 1.1; }
.mg-head b { font-size: 13px; color: var(--ink); font-weight: 500; min-width: 24px; text-align: center; border-radius: 999px; padding: 1px 0; }
.mg-head.today b { color: #fff; background: var(--coral); }
.mg-head.we, .mg-cell.we { background: #f8fbfc; }
.mg-corner, .mg-room {
  overflow: hidden; white-space: nowrap;
  position: sticky; left: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; gap: 6px; padding-left: 14px;
  font-weight: 500; font-size: 14px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
}
.mg-room small { font-size: 10.5px; color: var(--muted); font-weight: 400; }
.mg-corner { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.mg-cell { border-left: 1px solid #edf3f5; border-bottom: 1px solid var(--line); }
.mg-cell.today { background: rgba(224, 96, 47, .07); }
.can-add { cursor: pointer; }
.g-cell.can-add:hover, .mg-cell.can-add:hover { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.mg-occ { font-size: 12px; display: grid; place-items: center; border-bottom: 1px solid var(--line); background: rgba(17, 120, 154, calc(var(--o) * .45)); font-variant-numeric: tabular-nums; color: var(--ink); }
.mg-occ.today { box-shadow: inset 0 -2px 0 var(--coral); }
.mg-bar { margin: 6px 2px; padding: 0 8px; font-size: 12px; border-radius: 10px; }
.mg-bar.arr { background: var(--sun); color: #3a2800; }
.month-nav { gap: 6px; }
.month-stats { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; background: var(--surface); border-radius: 18px; padding: 12px 18px; margin-bottom: 12px; font-size: 14.5px; color: var(--ink-2); }
.month-stats b { font-size: 22px; font-weight: 300; color: var(--ink); font-variant-numeric: tabular-nums; }
.month-label { font-size: 16px; font-weight: 500; min-width: 150px; text-align: center; }
.res-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }

/* ---------- Modal y toast ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(16, 32, 29, .32); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: fade .18s ease-out;
}
.modal {
  background: var(--bg); border-radius: 30px; width: min(540px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto;
  padding: 26px; box-shadow: var(--shadow-lg); animation: rise .22s cubic-bezier(.2, .8, .2, 1);
}
.modal.wide { width: min(720px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.modal-title { font-size: 21px; font-weight: 500; letter-spacing: -.01em; }
.modal-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 12px 20px; border-radius: 999px; z-index: 70; font-size: 14px; box-shadow: var(--shadow-lg);
  animation: rise .22s ease-out; max-width: calc(100% - 32px); text-align: center;
}
.email-preview { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.email-head { background: var(--surface); padding: 12px 16px; font-size: 13.5px; display: grid; gap: 2px; }
.email-head b { font-weight: 500; }
.email-body { padding: 16px; font-size: 14px; white-space: pre-wrap; font-family: var(--font-ui); line-height: 1.55; max-height: 340px; overflow-y: auto; }

body:has(.savebar) .toast { bottom: 88px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.toast { animation-name: toastIn; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.view.enter { animation: fade .25s ease-out; }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.login-form-side { display: flex; flex-direction: column; padding: 34px clamp(20px, 6vw, 80px) 40px; }
.login-inner { width: min(420px, 100%); margin: auto 0; padding: 40px 0; display: flex; flex-direction: column; gap: 26px; }
.login h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 6vw, 64px); line-height: .98; letter-spacing: -.015em; }
.login h1 em { color: var(--coral); }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 52px; }
.pw-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.demo-box { border: 1px dashed #c8d8df; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.demo-accts { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-acct { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; font-size: 13px; }
.demo-acct:hover { border-color: var(--accent); }
.demo-acct .av { width: 28px; height: 28px; font-size: 11px; }
.demo-acct small { color: var(--muted); }
.login-art {
  margin: 14px; border-radius: 36px; position: relative; overflow: hidden;
  background: linear-gradient(165deg, #dcf0f7 0%, #eef8fb 45%, #fffdf7 100%);
  display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(28px, 4vw, 56px); min-height: 520px;
}
.login-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.login-art .art-text { position: relative; display: flex; flex-direction: column; gap: 18px; max-width: 460px; }
.login-art .quote { font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 40px); line-height: 1.08; color: #10303f; }
.login-art .quote em { color: var(--coral); }
.feat { display: flex; flex-wrap: wrap; gap: 8px; }
.feat span { background: rgba(255, 255, 255, .75); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink-2); }
.art-brand { display: none; }
[hidden] { display: none !important; }
.guest-link { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-ink); text-decoration: none; font-weight: 500; }
.guest-link:hover { text-decoration: underline; }

/* ---------- Huéspedes ---------- */
.guest { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 26px 16px 90px; background: radial-gradient(900px 420px at 85% -160px, rgba(242, 176, 64, .22) 0%, rgba(242, 176, 64, 0) 70%), radial-gradient(1200px 520px at 20% -200px, #dff1f7 0%, rgba(223, 241, 247, 0) 70%), var(--bg); }
.guest-top { width: min(600px, 100%); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.guest-card { width: min(600px, 100%); margin-top: 44px; display: flex; flex-direction: column; gap: 22px; }
.guest h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 7vw, 54px); line-height: 1; letter-spacing: -.01em; }
.choice {
  display: flex; gap: 16px; align-items: center; padding: 20px 22px; border-radius: 26px; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; text-align: left; width: 100%; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.choice:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
.choice-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.choice-ic svg { width: 24px; height: 24px; }
.choice-t { font-weight: 500; font-size: 17px; }
.choice-d { color: var(--muted); font-size: 14px; }
.stars { display: flex; gap: 6px; }
.stars button { border: 0; background: transparent; padding: 2px; cursor: pointer; color: #d6dedb; }
.stars button svg { width: 34px; height: 34px; fill: currentColor; stroke: none; }
.stars button.on { color: #e9a93a; }
.star-row { display: inline-flex; gap: 1px; color: #e9a93a; }
.star-row svg { width: 15px; height: 15px; fill: currentColor; }
.star-row .off { color: #dfe5e3; }
.lang { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 500; }
.lang button.on { background: var(--bg); color: var(--ink); box-shadow: var(--shadow); }
.guest h1 em { color: var(--coral); }
.guest-bye { font-family: var(--font-display); font-style: italic; font-size: 26px; color: var(--sea); }
.done { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 10px; }
.done-ic { width: 84px; height: 84px; border-radius: 50%; background: var(--sun-soft); color: var(--coral); display: grid; place-items: center; }
.done-ic svg { width: 38px; height: 38px; stroke-width: 1.8; }
.proto-pill {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 12.5px; background: rgba(21, 32, 29, .88);
  color: #fff; padding: 8px 16px; border-radius: 999px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; z-index: 20; white-space: nowrap;
}

/* ---------- Celular ---------- */
@media (max-width: 960px) {
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mtop {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 25;
    padding: 12px 16px; background: rgba(255, 255, 255, .9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .mtop .brand-logo { width: 38px; height: 38px; }
  .mtop .brand-name { font-size: 22px; }
  .mtop .me { padding: 3px; border: 0; }
  .mtop .bell { width: 40px; height: 40px; border: 0; }
  .notif-panel { position: fixed; left: 10px; right: 10px; top: 66px; width: auto; max-height: 72dvh; }
  .mtop .me-text { display: none; }
  .main { padding: 20px 16px 120px; }
  .topbar { margin-bottom: 20px; }
  .topbar .top-right { display: none; }
  .page-title { font-size: 26px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 10px; right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; padding: 6px;
    background: rgba(255, 255, 255, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-lg);
  }
  .tabbar a, .tabbar button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted);
    padding: 7px 0 6px; border-radius: 22px; text-decoration: none; position: relative; border: 0; background: transparent; cursor: pointer;
  }
  .tabbar .active { color: var(--accent-ink); background: var(--accent-soft); font-weight: 500; }
  .tabbar .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; font-size: 10.5px; padding: 0 5px; margin: 0; }
  .chat { grid-template-columns: 1fr; height: calc(100dvh - 250px); min-height: 420px; }
  .chat.has-thread .chat-list { display: none; }
  .chat:not(.has-thread) .thread { display: none; }
  .chat-list { border-right: 0; }
  .login { grid-template-columns: 1fr; }
  .login-art { order: -1; min-height: 210px; margin: 10px 10px 0; border-radius: 30px; padding: 24px; }
  .login-art .feat { display: none; }
  .login-art .quote { font-size: 26px; }
  .login-art .art-brand { display: block; position: absolute; top: 20px; left: 22px; right: 22px; }
  .login-art .art-brand .brand-logo { width: 38px; height: 38px; }
  .login-art .art-brand .brand-name { font-size: 22px; }
  .login-form-side { padding-top: 10px; }
  .login-form-side > .brand { display: none; }
  .login-inner { padding: 18px 0 30px; gap: 22px; }
  .overlay { align-items: flex-end; padding: 0; }
  .modal { border-radius: 30px 30px 0 0; width: 100%; max-height: 92dvh; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation-name: sheet; }
  .toast { bottom: calc(100px + env(safe-area-inset-bottom)); }
  .tile .num { font-size: 34px; }
  .savebar { bottom: calc(96px + env(safe-area-inset-bottom)); left: 10px; right: 10px; transform: none; max-width: none; justify-content: space-between; padding: 6px 6px 6px 16px; animation-name: rise; font-size: 14px; }
  .savebar .sb-dt { display: none; }
  .savebar .btn.ghost { width: 38px; padding: 0; }
  .mtop .brand-img { height: 50px; max-width: 160px; }
  body:has(.savebar) .toast { bottom: calc(160px + env(safe-area-inset-bottom)); }
  .login-art .art-brand .brand-img { height: 54px; }
  .week-card { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { padding: 14px 16px 16px; border-radius: 22px; }
  .tiles > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tile .lbl { font-size: 13.5px; }
  .form-row { grid-template-columns: 1fr; }
  .card { padding: 18px; border-radius: 24px; }
  .occ-stats { grid-template-columns: repeat(3, auto); gap: 6px 18px; }
  .item { padding: 14px 14px 14px 18px; }
  .inv-row { padding: 12px 12px 12px 16px; }
  .stock, .mark { width: 100%; }
  .stock button, .mark button { flex: 1; }
  .social { grid-template-columns: 1fr; }
  .follow { width: 100%; display: grid; grid-template-columns: 1fr 1fr; border-radius: 20px; }
  .follow button { padding: 8px 6px; border-radius: 16px; }
  .hello { font-size: 40px; }
}
@keyframes sheet { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function demoReservations(blocks) {
  const R = (room, guest, inOff, nights, channel, pax) => ({ id: "r" + uid(), room, guest, checkin: iso(addDays(TODAY, inOff)), checkout: iso(addDays(TODAY, inOff + nights)), nights, channel, pax, note: "" });
  const list = [
    R("3", "Liam Thompson", -2, 4, "Booking.com", 2), R("4", "Chloé Martin", -1, 2, "Airbnb", 2),
    R("1", "Familia Vargas Mora", 0, 3, "Directo", 4), R("5", "Matteo Rossi", -3, 3, "Booking.com", 2),
    R("5", "Ana Lucía Fernández", 0, 2, "Expedia", 2), R("8", "Kenji Nakamura", -4, 6, "Expedia", 2),
    R("9", "Sarah Miller", -1, 5, "Booking.com", 1), R("10", "Lukas Schneider", 1, 3, "Booking.com", 2),
    R("12", "Isabella y Tom", 2, 4, "Directo", 2), R("2", "Carlos Jiménez", -2, 2, "Directo", 1),
    R("6", "Familia Johnson", 3, 4, "Airbnb", 5), R("9", "Emma Laurent", 5, 2, "Airbnb", 2),
    R("2", "Valentina Ruiz", 4, 3, "Expedia", 2), R("1", "Noah Williams", 4, 2, "Booking.com", 2),
  ];
  /* Más reservas de ejemplo para ver meses completos */
  const NAMES = ["Olivia Brown", "Diego Castro", "Hannah Müller", "Lucas Moreau", "Sofía Araya", "Jack Wilson", "Mia Johansson", "Pablo Herrera", "Emily Davis", "Léa Dubois", "Andrés Mora", "Grace Lee", "Tomás Rojas", "Ava Martin", "Felipe Soto", "Chiara Bianchi", "Noa Levi", "Ethan Clark", "Valeria Castillo", "Ben Taylor", "Isla Novak", "Mateo Vargas", "Zoe Fischer", "Daniel Kim", "Familia Pérez", "Laura Gómez", "Oscar Lind", "Nina Rossi"];
  const CH = ["Booking.com", "Airbnb", "Directo", "Expedia", "Booking.com", "Directo", "Airbnb"];
  const rng = mulberry32(4128);
  const start = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1);
  const end = new Date(TODAY.getFullYear(), TODAY.getMonth() + 3, 0);
  const winA = addDays(TODAY, -5), winB = addDays(TODAY, 3);
  const overl = (a1, b1, a2, b2) => a1 < b2 && a2 < b1;
  for (const r of ROOMS) {
    let cur = new Date(start);
    while (cur < end) {
      cur = addDays(cur, Math.floor(rng() * 3));
      if (rng() < 0.2) { cur = addDays(cur, 1 + Math.floor(rng() * 3)); continue; }
      const nights = 1 + Math.floor(rng() * 5);
      const ci = cur, co = addDays(cur, nights);
      if (overl(ci, co, winA, winB)) { cur = new Date(winB); continue; }
      const busy = list.some((x) => x.room === r.n && overl(ci, co, fromIso(x.checkin), fromIso(x.checkout))) || blocks.some((b) => b.room === r.n && overl(ci, co, fromIso(b.from), fromIso(b.to)));
      if (busy) { cur = addDays(cur, 1); continue; }
      list.push({ id: "r" + uid(), note: "", room: r.n, guest: NAMES[Math.floor(rng() * NAMES.length)], checkin: iso(ci), checkout: iso(co), nights, channel: CH[Math.floor(rng() * CH.length)], pax: 1 + Math.floor(rng() * 3) });
      cur = co;
    }
  }
  return list;
}

function load() {
  if (REAL) return emptyState();

    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.version === 4 && s.inv) { s.inv.restockReports = s.inv.restockReports || []; s.version = 5; }
      if (s && s.version === 6) { s.rooms = ROOMS.map((r) => ({ ...r })); s.blocks = demoBlocks(); s.res = demoReservations(s.blocks); s.version = 7; }

        s.users = s.users.filter((u) => !(u.id === "u13" && u.title === "Secretaría"));
        for (const sc of s.schedules || []) if (sc.cells) delete sc.cells.u13;
        for (const u of s.users) if (u.role === "empleado" && /recepci/i.test(u.title || "")) u.perms = { ...(u.perms || {}), reservas: true };
        s.version = 9;
      }
      if (s && s.version === 9) {
        const x = seedExtras();
        for (const k of Object.keys(x)) if (s[k] === undefined) s[k] = x[k];
        for (const u of s.users) if (u.vacDays === undefined) u.vacDays = 14;
        if (s.hotel && !s.hotel.guestUrl) s.hotel.guestUrl = GUEST_URL;
        s.version = 10;
      }
      if (s && s.version === VERSION) return s;
    }
  } catch (e) { /* sin almacenamiento: se usa memoria */ }
  return seed();
}

      const n = S.requests.filter((r) => r.userId === me.id && r.status === "pendiente").length; return n ? [n, "soft"] : null;

/* Olas suaves en el panel de bienvenida */
let wavesRaf = 0;
function startWaves() {
  const c = $("#waves"); if (!c) return;
  const ctx = c.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  const draw = () => {
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const lines = 9;
    for (let i = 0; i < lines; i++) {
      const y0 = h * 0.18 + i * (h * 0.055);
      const amp = 8 + i * 1.6;
      const freq = 0.006 + i * 0.0004;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 6) {
        const y = y0 + Math.sin(x * freq + t * (0.6 + i * 0.05) + i) * amp + Math.sin(x * freq * 0.4 - t * 0.3) * amp * 0.6;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(19,138,166,${0.08 + i * 0.02})`;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
    // sol
    ctx.beginPath();
    ctx.arc(w * 0.76, h * 0.17, Math.min(w, h) * 0.07, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(242,176,64,.55)";
    ctx.fill();
    t += 0.012;
    if (!reduce && document.body.contains(c)) wavesRaf = requestAnimationFrame(draw);
  };
  cancelAnimationFrame(wavesRaf);
  draw();
}
function stopWaves() { cancelAnimationFrame(wavesRaf); }

/* Achica la foto (máx. 1024 px, JPEG) para que pese poco */
function readPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type || "image/")) return reject(new Error("tipo"));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("lectura"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("imagen"));
      img.onload = () => {
        const max = 1024, w = img.naturalWidth || max, h = img.naturalHeight || max, k = Math.min(1, max / Math.max(w, h));
        const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.62));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function thumbs(photos, kind, id) {
  if (!photos || !photos.length) return "";
  return `<div class="thumbs">${photos.map((p, j) => `<button type="button" class="thumb" data-act="photo-view" data-kind="${kind}" data-id="${id}" data-j="${j}" aria-label="Ver foto ${j + 1}"><img src="${p}" alt=""></button>`).join("")}</div>`;

function vInicio(me) {
  const admin = isAdmin(me);
  const h = new Date().getHours();
  const greet = h < 12 ? "Buenos días" : h < 18 ? "Buenas tardes" : "Buenas noches";
  const pend = S.requests.filter((r) => r.status === "pendiente").length;
  const openInc = S.incidents.filter((i) => i.status !== "resuelto");
  const altas = openInc.filter((i) => i.prio === "alta").length;
  const newGuest = S.guest.filter((g) => g.status === "nuevo");
  const gInc = newGuest.filter((g) => g.kind === "incidente").length;
  const iw = curWeek();
  const invRev = S.products.filter((p) => iw.marks[p.id]).length;
  const invNo = noQueda(iw).length;
  const invPend = faltantes().length;
  const rev = S.schedules.filter((s) => s.status === "revision").length;
  const unread = unreadFor(me);
  const tile = (href, ic, num, lbl, sub = "", alert = false, txt = false) => `<a class="tile ${alert ? "alert" : ""}" href="#${href}"><span class="tile-top">${icon(ic)}</span><span class="num ${txt ? "txt" : ""}">${num}</span><span class="lbl">${lbl}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</a>`;
  let tiles;
  if (admin) {
    tiles = tile("solicitudes", "calendar", pend, "Solicitudes por aprobar", pend ? "Permisos, vacaciones y horas extra" : "Todo al día")
      + tile("incidentes", "alert", openInc.length, "Incidentes abiertos", altas ? `${altas} de prioridad alta` : "Ninguno urgente", altas > 0)
      + tile("buzon", "inbox", newGuest.length, "Mensajes nuevos de huéspedes", gInc ? plural(gInc, "problema reportado", "problemas reportados") : "Solo comentarios")
      + tile("insumos", "box", invPend, "Faltantes de insumos", invPend ? "Al reponerlos, márcalos en Reposición" : "Todo repuesto", invPend > 0)
      + tile("horarios", "grid", rev ? "En revisión" : "Al día", "Horario de la próxima semana", rev ? "Esperando tu aprobación" : "", false, true);
  } else {
    const mine = S.requests.filter((r) => r.userId === me.id && r.status === "pendiente").length;
    const pub = currentPublished();
    const code = pub?.cells[me.id]?.[dayIndexToday];
    const sh = code ? SHIFTS[code] : null;
    tiles = tile("horarios", "clock", sh ? sh.label : "Sin horario", "Tu turno de hoy", sh ? sh.time : "Aún no hay horario publicado", false, true)
      + tile("solicitudes", "calendar", mine, "Solicitudes esperando respuesta")
      + tile("mensajes", "chat", unread, "Mensajes sin leer", "De jefatura")
      + tile("insumos", "box", S.products.length - invRev, "Insumos sin revisar esta semana", `${invRev} de ${S.products.length} revisados · ${invNo} no quedan`);
  }
  const ht = hotelToday();
  const arrivals = ht.arrivals.length
    ? `<ul class="list-plain">${ht.arrivals.map((r) => `<li><span class="av" aria-hidden="true">${esc(r.room)}</span><span class="grow"><span style="display:block;font-weight:500">${esc(r.guest)}</span><span class="small muted">${plural(r.nights, "noche", "noches")} · ${esc(r.channel)}</span></span>${pill("Llega hoy", "info")}</li>`).join("")}</ul>`
    : `<p class="muted">No hay llegadas hoy.</p>`;

  // Actividad reciente (el personal no ve solicitudes de otras personas)
  const ev = [];
  for (const r of S.requests) if (admin || r.userId === me.id) ev.push({ at: r.at, ic: "calendar", t: `<b>${esc(firstName(nameOf(r.userId)))}</b> pidió ${REQ_TYPES[r.type].label.toLowerCase()}` });
  for (const i of S.incidents) ev.push({ at: i.at, ic: "alert", t: `<b>${esc(firstName(nameOf(i.by)))}</b> reportó: ${esc(i.text.split(".")[0])}` });
  for (const g of S.guest) ev.push({ at: g.at, ic: "inbox", t: g.kind === "incidente" ? `Huésped de ${esc(roomLabel(g.room).toLowerCase())} reportó un problema` : `Nuevo comentario de huésped ${stars(g.rating)}` });
  for (const r of S.res) if (r.by) ev.push({ at: r.at, ic: "bed", t: `<b>${esc(firstName(nameOf(r.by)))}</b> agregó la reserva de ${esc(r.guest)} (hab. ${esc(r.room)})` });
  for (const b of S.blocks) if (b.by && b.at) ev.push({ at: b.at, ic: "lock", t: `<b>${esc(firstName(nameOf(b.by)))}</b> bloqueó la habitación ${esc(b.room)}: ${esc(b.reason)}` });
  for (const w of Object.values(S.inv.weeks)) {
    for (const sv of w.saves) ev.push({ at: sv.at, ic: "box", t: `<b>${esc(firstName(nameOf(sv.by)))}</b> guardó el conteo de ${plural(sv.n, "insumo", "insumos")}` });
    for (const [id, fo] of Object.entries(w.follow)) { const p = prodById(id); if (p && fo.s !== "pendiente") ev.push({ at: fo.at, ic: "box", t: `<b>${esc(firstName(nameOf(fo.by)))}</b> marcó ${esc(p.name.toLowerCase())}: ${FOLLOW[fo.s].toLowerCase()}` }); }
  }
  ev.sort((a, b) => b.at - a.at);
  const feed = ev.slice(0, 7).map((e) => `<li><span class="av" style="background:var(--surface);color:var(--muted)">${icon(e.ic, "sm")}</span><span class="grow"><span style="display:block">${e.t}</span><span class="small muted">${fmtRel(e.at)}</span></span></li>`).join("");

  const imp = newsUnread(me).filter((n) => n.important).sort((a, b) => b.at - a.at)[0];
  const banner = imp ? `<div class="callout warn" style="margin-bottom:18px">${icon("megaphone")}<div class="callout-body"><span class="callout-title">${esc(imp.title)}</span><span>${esc(imp.text.length > 160 ? imp.text.slice(0, 160) + "…" : imp.text)}</span><div class="actions" style="margin-top:8px"><button type="button" class="btn sm primary" data-act="news-read" data-id="${imp.id}">${icon("check", "sm")} Leído</button><a class="btn sm" href="#comunicados">Ver comunicados</a></div></div></div>` : "";
  const hc = hkCounts(), lastShift = shiftsSorted()[0], shPend = lastShift ? lastShift.items.filter((x) => !x.done).length : 0;
  tiles += tile("limpieza", "sparkle", hc.sucia + hc.limpiando, "Habitaciones por limpiar", hc.urgent ? `${hc.urgent} con llegada hoy sin estar lista` : `${hc.lista + hc.revisada} listas`, hc.urgent > 0)
    + tile("turno", "clipboard", shPend, "Pendientes de la entrega de turno", lastShift ? `Turno de ${TURNOS[lastShift.turno].toLowerCase()} · ${firstName(nameOf(lastShift.by))}` : "Sin entregas todavía");
  return `<div class="topbar"><div><p class="eyebrow">${esc(fmtLong(new Date()))}</p><h1 class="hello">${greet}, <em>${esc(firstName(me.name))}</em></h1></div>${topRight(me)}</div>
    ${banner}<div class="tiles">${tiles}</div>
    <div class="cols" style="margin-top:20px">
      <section class="card">
        <div class="card-head"><h2>Hoy en el hotel</h2>${pill("Reservas registradas", "line")}</div>
        <div class="occ">${ring(ht.occ)}<div class="occ-stats"><div><b>${ht.arrivals.length}</b><span>Llegadas</span></div><div><b>${ht.departures.length}</b><span>Salidas</span></div><div><b>${ht.blocked.length}</b><span>Bloqueadas</span></div></div></div>
        <div style="margin-top:18px">${arrivals}</div>
        <a class="btn sm" href="#habitaciones" style="margin-top:12px">Ver habitaciones</a>
      </section>
      <section class="card">
        <div class="card-head"><h2>Actividad reciente</h2></div>
        <ul class="list-plain">${feed}</ul>
      </section>
    </div>`;
}

function reqDetail(r) {

  if (r.type === "salida") return `${fmtShort(r.date)} · sale a las ${esc(r.time)}`;
  return `${fmtShort(r.date)} · ${plural(Number(r.hours), "hora extra", "horas extra")}`;
}
function reqCard(r, me, showWho) {
  const [st, cls] = REQ_STATUS[r.status];
  const t = REQ_TYPES[r.type];
  let decision = "";
  if (r.status !== "pendiente") decision = `<div class="note ${r.status === "aprobada" ? "ok" : "bad"}"><b>${st} por ${esc(firstName(nameOf(r.decidedBy)))}</b> · ${fmtRel(r.decidedAt)}${r.comment ? `<br>${esc(r.comment)}` : ""}</div>`;
  let acts = "";
  if (r.status === "pendiente" && isAdmin(me)) acts = `<div class="actions"><button type="button" class="btn sm primary" data-act="req-approve" data-id="${r.id}">${icon("check", "sm")} Aprobar</button><button type="button" class="btn sm danger" data-act="req-reject" data-id="${r.id}">${icon("x", "sm")} Rechazar</button></div>`;
  else if (r.status === "pendiente" && r.userId === me.id) acts = `<div class="actions"><button type="button" class="btn sm ghost danger" data-act="req-cancel" data-id="${r.id}">Cancelar solicitud</button></div>`;
  const u = userById(r.userId);
  return `<article class="item ${r.status === "pendiente" ? "s-warn" : ""}">
    <div class="item-top"><div class="item-tags">${pill(t.label, t.pill)}${showWho && u ? `<span class="small" style="color:var(--ink-2);font-weight:500">${esc(u.name)}</span><span class="small muted">${esc(u.title)}</span>` : ""}</div>${pill(st, cls, true)}</div>
    <div class="item-title">${reqDetail(r)}</div>
    ${r.reason ? `<p class="item-text">${esc(r.reason)}</p>` : ""}
    ${showWho && u && r.type === "vacaciones" && r.status === "pendiente" ? (() => { const b = vacBalance(u), ask = vacOverlapDays(r, `${b.year}-01-01`, `${b.year}-12-31`), rest = b.left - ask; return `<div class="note ${rest < 0 ? "bad" : ""}">Le quedan <b>${b.left}</b> de ${b.total} días este año${rest < 0 ? ` · <b>se pasa por ${-rest}</b>` : ` · después le quedarían ${rest}`}</div>`; })() : ""}
    <div class="meta"><span>Enviada ${fmtRel(r.at)}</span></div>
    ${decision}${acts}
  </article>`;
}

function incCard(i, me) {
  const [st, cls] = INC_STATUS[i.status];
  const resolved = i.status === "resuelto";
  let loan = "";
  if (i.type === "prestamo") loan = `<div class="note"><b>${esc(i.item || "Préstamo")}</b>${i.to ? ` · ${esc(i.to)}` : ""}${i.due ? ` · devolver: ${fmtShort(i.due)}` : ""}${i.returned ? " · <b>devuelto</b>" : ""}</div>`;
  const last = i.log && i.log.length ? i.log[i.log.length - 1] : null;
  const btns = [];
  if (!resolved) {
    if (i.status === "abierto") btns.push(`<button type="button" class="btn sm" data-act="inc-status" data-id="${i.id}" data-s="proceso">En proceso</button>`);
    if (i.type === "prestamo") btns.push(`<button type="button" class="btn sm ok" data-act="inc-returned" data-id="${i.id}">${icon("check", "sm")} Marcar devuelto</button>`);
    else btns.push(`<button type="button" class="btn sm ok" data-act="inc-status" data-id="${i.id}" data-s="resuelto">${icon("check", "sm")} Resuelto</button>`);
  } else btns.push(`<button type="button" class="btn sm ghost" data-act="inc-status" data-id="${i.id}" data-s="abierto">Reabrir</button>`);
  if (isAdmin(me)) btns.push(`<button type="button" class="btn sm ghost danger icon" data-act="inc-delete" data-id="${i.id}" aria-label="Eliminar">${icon("trash", "sm")}</button>`);
  return `<article class="item ${resolved ? "dim" : "s-" + i.prio}">
    <div class="item-top"><div class="item-tags">${pill(INC_TYPES[i.type], "line")}${i.room ? pill(esc(roomLabel(i.room)), "") : ""}${!resolved ? pill("Prioridad " + PRIOS[i.prio].toLowerCase(), i.prio === "alta" ? "bad" : i.prio === "media" ? "warn" : "") : ""}</div>${pill(st, cls, true)}</div>
    <p class="item-text" style="color:var(--ink)">${esc(i.text)}</p>
    ${thumbs(i.photos, "inc", i.id)}
    ${loan}
    <div class="meta"><span>Reportó ${esc(nameOf(i.by))} · ${fmtRel(i.at)}</span>${last ? `<span>${INC_STATUS[last.s][0]} por ${esc(firstName(nameOf(last.by)))} · ${fmtRel(last.at)}</span>` : ""}</div>
    <div class="actions">${btns.join("")}</div>
  </article>`;
}

function vBuzon(me) {

/* =========================================================

function vMensajes(me) {
  const admin = isAdmin(me);
  const people = admin ? employees() : admins();
  const keyWith = (p) => (admin ? threadKey(p.id, me.id) : threadKey(me.id, p.id));
  const rows = people.map((p) => {
    const k = keyWith(p), msgs = S.threads[k] || [];
    const last = msgs[msgs.length - 1];
    const unread = msgs.filter((m) => m.from !== me.id && m.at > ((S.reads[me.id] || {})[k] || 0)).length;
    return { p, k, msgs, last, unread };
  }).sort((a, b) => (b.last?.at || 0) - (a.last?.at || 0));
  const mobile = window.matchMedia("(max-width: 900px)").matches;
  if (!ui.chatWith && !mobile && rows.length) ui.chatWith = rows[0].p.id;
  if (ui.chatWith && !people.some((p) => p.id === ui.chatWith)) ui.chatWith = null;
  const cur = rows.find((r) => r.p.id === ui.chatWith);
  if (cur) {
    const lastAt = cur.last ? cur.last.at : 0;
    S.reads[me.id] = S.reads[me.id] || {};
    if ((S.reads[me.id][cur.k] || 0) < lastAt) { S.reads[me.id][cur.k] = Date.now(); cur.unread = 0; save(); }
  }
  const list = rows.map((r) => `<button type="button" class="person ${r.p.id === ui.chatWith ? "on" : ""}" data-act="chat-open" data-id="${r.p.id}">${avatar(r.p)}<span class="grow"><span class="person-name ellipsis" style="display:block">${esc(r.p.name)}</span><span class="person-last ellipsis" style="display:block">${r.last ? (r.last.from === me.id ? "Tú: " : "") + esc(r.last.text) : esc(r.p.title)}</span></span>${r.unread ? `<span class="badge">${r.unread}</span>` : ""}</button>`).join("");
  let thread = `<div class="chat-empty"><div>${icon("chat")}<p style="margin-top:8px">Elige una conversación</p></div></div>`;
  if (cur) {
    let msgsHtml = "", lastDay = "";
    for (const m of cur.msgs) {
      const d = iso(new Date(m.at));
      if (d !== lastDay) { lastDay = d; msgsHtml += `<span class="day-sep">${d === todayIso ? "Hoy" : d === iso(addDays(TODAY, -1)) ? "Ayer" : fmtShort(d)}</span>`; }
      msgsHtml += `<div class="bubble ${m.from === me.id ? "mine" : "theirs"}">${esc(m.text)}<time>${fmtTime(m.at)}</time></div>`;
    }
    if (!cur.msgs.length) msgsHtml = `<div class="chat-empty"><p>Escríbele a ${esc(firstName(cur.p.name))}. Solo ustedes dos ven esta conversación.</p></div>`;
    thread = `<div class="thread-head"><button type="button" class="btn ghost sm icon" data-act="chat-back" aria-label="Volver" style="${mobile ? "" : "display:none"}">${icon("back")}</button>${avatar(cur.p)}<div class="grow"><div class="person-name">${esc(cur.p.name)}</div><div class="lock">${icon("lock", "sm")} Privado: solo tú y ${esc(firstName(cur.p.name))}</div></div></div>
      <div class="msgs" id="msgs">${msgsHtml}</div>
      <form class="composer" data-form="chat" autocomplete="off"><input type="text" name="text" id="chat-input" placeholder="Escribe un mensaje" aria-label="Mensaje" maxlength="1000"><button type="submit" class="btn primary icon" aria-label="Enviar">${icon("send", "sm")}</button></form>`;
  }
  return topbar(me, "Mensajes", admin ? "Conversaciones privadas con cada persona del equipo." : "Escríbele a jefatura. Tus conversaciones son privadas: el resto del personal no las ve.")
    + `<div class="chat ${cur ? "has-thread" : ""}"><div class="chat-list"><div class="chat-list-title">${admin ? "Personal" : "Jefatura"}</div>${list || '<p class="muted small" style="padding:10px">No hay personas para escribir.</p>'}</div><div class="thread">${thread}</div></div>`;

const canMake = (u) => !!u && u.role === "gerente";

function schedRows(s) {

}
const legend = () => `<div class="legend">${Object.entries(SHIFTS).map(([k, v]) => `<span class="shift sh-${k}">${v.label}${v.time ? ` <small>${v.time}</small>` : ""}</span>`).join("")}</div>`;

function schedItem(s, me) {

function vHorarios(me) {

const ACT_X = {}, FORMS_X = {}, CHANGE_X = {};
const modalHead = (title, sub = "") => `<div class="modal-head"><div><h2 class="modal-title">${title}</h2>${sub ? `<p class="modal-sub">${sub}</p>` : ""}</div><button type="button" class="btn ghost icon sm" data-act="close-modal" aria-label="Cerrar">${icon("x")}</button></div>`;

/* ---------------------------------------------------------
   Limpieza de habitaciones
   --------------------------------------------------------- */
const HK = { sucia: ["Sucia", "bad"], limpiando: ["Limpiando", "warn"], lista: ["Lista", "ok"], revisada: ["Revisada", "accent"] };
const canInspect = (u) => isAdmin(u) || isGerente(u) || !!u?.perms?.reservas;
function hkStatus(n) {
  const rec = S.hk[n];
  const dep = S.res.some((r) => r.room === n && r.checkout === todayIso);
  if (rec && iso(new Date(rec.at)) === todayIso) return { ...rec, auto: false };
  if (dep) return { s: "sucia", auto: true };
  if (rec) return { ...rec, auto: false };
  return { s: "lista", auto: true };
}
const arrivesToday = (n) => S.res.some((r) => r.room === n && r.checkin === todayIso);
const hkUrgent = (n) => arrivesToday(n) && !["lista", "revisada"].includes(hkStatus(n).s) && !S.blocks.some((b) => b.room === n && b.from <= todayIso && todayIso < b.to);
function hkCounts() {
  const c = { sucia: 0, limpiando: 0, lista: 0, revisada: 0, urgent: 0 };
  for (const r of S.rooms) { c[hkStatus(r.n).s]++; if (hkUrgent(r.n)) c.urgent++; }
  return c;
}
function vLimpieza(me) {
  const f = ui.hkFilter || "todas", c = hkCounts();
  const order = { sucia: 0, limpiando: 1, lista: 2, revisada: 3 };
  let rooms = roomsSorted().map((r) => ({ r, h: hkStatus(r.n), t: roomToday(r.n), u: hkUrgent(r.n) }));
  if (f === "limpiar") rooms = rooms.filter((x) => ["sucia", "limpiando"].includes(x.h.s));
  if (f === "listas") rooms = rooms.filter((x) => ["lista", "revisada"].includes(x.h.s));
  rooms.sort((a, b) => (b.u - a.u) || order[a.h.s] - order[b.h.s] || (parseInt(a.r.n, 10) || 0) - (parseInt(b.r.n, 10) || 0));
  const states = Object.entries(HK).filter(([k]) => k !== "revisada" || canInspect(me));
  const cards = rooms.map(({ r, h, t, u }) => `<article class="hk-card hk-${h.s} ${u ? "urgent" : ""}">
      <div class="item-top"><div><span class="room-num">${esc(r.n)}</span> <span class="room-type">${esc(r.type || "")}</span></div>${pill(HK[h.s][0], HK[h.s][1], true)}</div>
      <div class="meta"><span>${pill(t.label, t.cls)}</span><span>${esc(t.text)}</span></div>
      ${u ? `<div class="note bad">${icon("alert", "sm")} <b>Llega un huésped hoy</b> y la habitación todavía no está lista.</div>` : ""}
      <div class="mark hk-mark" role="group" aria-label="Estado de limpieza de la habitación ${esc(r.n)}">${states.map(([k, v]) => `<button type="button" class="${k} ${h.s === k ? "on" : ""}" data-act="hk-set" data-r="${esc(r.n)}" data-s="${k}" aria-pressed="${h.s === k}">${v[0]}</button>`).join("")}</div>
      <div class="inv-sub">${h.auto ? (h.s === "sucia" ? "Sucia por la salida de hoy" : "Sin cambios hoy") : `${HK[h.s][0]} · ${esc(firstName(nameOf(h.by)))}, ${fmtRel(h.at)}`}</div>
    </article>`).join("");
  const tile = (n, l, cls = "") => `<div class="tile ${cls}"><span class="num">${n}</span><span class="lbl">${l}</span></div>`;
  return topbar(me, "Limpieza de habitaciones", "Cada salida deja la habitación como sucia. Limpieza la marca mientras trabaja y recepción revisa antes de entregarla.")
    + (c.urgent ? `<div class="callout warn" style="margin-bottom:18px">${icon("alert")}<div class="callout-body"><span class="callout-title">${plural(c.urgent, "habitación con llegada hoy no está lista", "habitaciones con llegada hoy no están listas")}</span><span>Aparecen primero en la lista.</span></div></div>` : "")
    + `<div class="tiles">${tile(c.sucia, "Sucias", c.sucia ? "alert" : "")}${tile(c.limpiando, "Limpiando")}${tile(c.lista, "Listas")}${tile(c.revisada, "Revisadas")}</div>
    <div class="toolbar" style="margin-top:22px"><div class="seg"><button type="button" data-act="hk-filter" data-f="todas" class="${f === "todas" ? "on" : ""}">Todas</button><button type="button" data-act="hk-filter" data-f="limpiar" class="${f === "limpiar" ? "on" : ""}">Por limpiar <span class="count">${c.sucia + c.limpiando}</span></button><button type="button" data-act="hk-filter" data-f="listas" class="${f === "listas" ? "on" : ""}">Listas <span class="count">${c.lista + c.revisada}</span></button></div>${canInspect(me) ? "" : `<span class="small muted">«Revisada» la marca recepción, gerencia o jefatura.</span>`}</div>
    <div class="hk-grid">${cards || emptyBox("No hay habitaciones con este filtro")}</div>`;
}
ACT_X["hk-filter"] = (el) => { ui.hkFilter = el.dataset.f; render(); };

  if (st === "revisada" && !canInspect(me)) return;
